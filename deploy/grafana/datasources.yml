apiVersion: 1
datasources:
  - name: SwiftRide Metrics
    uid: swiftride-prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
  - name: SwiftRide Logs
    uid: swiftride-loki
    type: loki
    access: proxy
    url: http://localhost:3100
  - name: SwiftRide Traces
    uid: swiftride-tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      nodeGraph:
        enabled: true
