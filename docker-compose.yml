name: swiftride
x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  Auth__Authority: http://keycloak:8080/realms/swiftride
  Auth__Issuer: http://localhost:8081/realms/swiftride
  Auth__ServiceSecret: ${SERVICE_CLIENT_SECRET:?Run scripts/setup.py}
  Rabbit__Host: rabbitmq
  Rabbit__Username: ${RABBIT_USER:-swiftride}
  Rabbit__Password: ${RABBIT_PASSWORD:?Run scripts/setup.py}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  Payments__Provider: Cod
  Logging__LogLevel__Microsoft: Warning
x-api: &api
  mem_limit: 384m
  memswap_limit: 384m
  restart: unless-stopped
  networks: [backend]
  init: true
  healthcheck:
    interval: 15s
    timeout: 8s
    retries: 10
    start_period: 40s
services:
  sqlserver:
    profiles: [migration]
    mem_limit: 2560m
    memswap_limit: 2560m
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run scripts/setup.py}
      MSSQL_MEMORY_LIMIT_MB: 2048
    volumes: [trip-data:/var/opt/mssql]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mongo:
    mem_limit: 768m
    memswap_limit: 768m
    command: [mongod, --wiredTigerCacheSizeGB, "0.25"]
    image: mongo:8.0.8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run scripts/setup.py}
      MATCH_DB_PASSWORD: ${MATCH_DB_PASSWORD:?Run scripts/setup.py}
    volumes: [match-data:/data/db, ./deploy/mongo/init.js:/docker-entrypoint-initdb.d/10-user.js:ro]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand("ping").ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 20
  postgres:
    mem_limit: 1g
    memswap_limit: 1g
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_DB: PayDB
      POSTGRES_USER: swiftride_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/setup.py}
    volumes: [pay-data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U swiftride_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
  postgres-init:
    mem_limit: 128m
    memswap_limit: 128m
    image: postgres:17.4-alpine3.21
    entrypoint: [/bin/sh, /init.sh]
    environment:
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/setup.py}
      TRIP_DB_PASSWORD: ${TRIP_DB_PASSWORD:?Run scripts/setup.py}
      PAY_DB_PASSWORD: ${PAY_DB_PASSWORD:?Run scripts/setup.py}
    volumes: [./deploy/postgres/init.sh:/init.sh:ro]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
  rabbitmq:
    mem_limit: 384m
    memswap_limit: 384m
    build: ./deploy/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-swiftride}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Run scripts/setup.py}
    ports: [127.0.0.1:15672:15672]
    volumes: [rabbit-data:/var/lib/rabbitmq]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 8s
      retries: 20
  keycloak:
    mem_limit: 768m
    memswap_limit: 768m
    image: quay.io/keycloak/keycloak:26.2.5
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/setup.py}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HEALTH_ENABLED: true
      KC_HTTP_ENABLED: true
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      OPS_CLIENT_SECRET: ${OPS_CLIENT_SECRET:?Run scripts/setup.py}
      RIDER_PASSWORD: ${RIDER_PASSWORD}
      DRIVER_PASSWORD: ${DRIVER_PASSWORD}
      OPS_PASSWORD: ${OPS_PASSWORD}
    ports: [127.0.0.1:8081:8080]
    volumes:
      - ./deploy/keycloak/themes/swiftride:/opt/keycloak/themes/swiftride:ro
      - identity-data:/opt/keycloak/data
      - ./deploy/keycloak/swiftride-realm.json:/opt/keycloak/data/import/swiftride-realm.json:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          'bash -ec ''exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q "UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  trip:
    <<: *api
    build: { context: ./backend, args: { SERVICE: TripService } }
    environment:
      <<: *api-env
      ConnectionStrings__Trip: Host=postgres;Database=TripDB;Username=trip;Password=${TRIP_DB_PASSWORD};GSS Encryption Mode=Disable
    healthcheck:
      test: [CMD, dotnet, TripService.dll, --health]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      postgres-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  matching:
    <<: *api
    build: { context: ./backend, args: { SERVICE: MatchingService } }
    environment:
      <<: *api-env
      ConnectionStrings__Matching: mongodb://matching:${MATCH_DB_PASSWORD}@mongo:27017/MatchDB?authSource=MatchDB
      Maps__Provider: ${MAPS_PROVIDER:-Geoapify}
      Maps__ApiKey: ${GEOAPIFY_API_KEY:-}
      Fixtures__Enabled: ${FIXTURES_ENABLED:-false}
      Auth__AdminClientSecret: ${OPS_CLIENT_SECRET:?Run scripts/setup.py}
      Pricing__Surge: ${PRICING_SURGE:-1}
      Pricing__Toll: ${PRICING_TOLL:-0}
      Pricing__Promotion: ${PRICING_PROMOTION:-1}
      Pricing__Tax: ${PRICING_TAX:-0.1}
    healthcheck:
      test: [CMD, dotnet, MatchingService.dll, --health]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      mongo: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  payment:
    <<: *api
    build: { context: ./backend, args: { SERVICE: PaymentService } }
    environment:
      <<: *api-env
      Payments__Provider: Cod
      VnpaySandbox__Enabled: ${VNPAY_SANDBOX_ENABLED:-false}
      VnpaySandbox__TmnCode: ${VNPAY_TMN_CODE:-}
      VnpaySandbox__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnpaySandbox__ReturnUrl: ${VNPAY_RETURN_URL:-http://localhost:3000/payments/return}
      VnpaySandbox__ClientIp: ${VNPAY_CLIENT_IP:-127.0.0.1}
      ConnectionStrings__Payment: Host=postgres;Database=PayDB;Username=payment_app;Password=${PAY_DB_PASSWORD};GSS Encryption Mode=Disable
    healthcheck:
      test: [CMD, dotnet, PaymentService.dll, --health]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      postgres-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  gateway:
    <<: *api
    build: { context: ./backend, args: { SERVICE: ApiGateway } }
    environment:
      <<: *api-env
    ports: [127.0.0.1:8080:8080]
    healthcheck:
      test: [CMD, dotnet, ApiGateway.dll, --health]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      trip: { condition: service_healthy }
      matching: { condition: service_healthy }
      payment: { condition: service_healthy }
  web:
    mem_limit: 384m
    memswap_limit: 384m
    build: ./frontend
    environment:
      AUTH_URL: http://localhost:3000
      AUTH_PUBLIC_URL: http://localhost:8081
      AUTH_INTERNAL_URL: http://keycloak:8080
      AUTH_KEYCLOAK_SECRET: ${WEB_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?Run scripts/setup.py}
      AUTH_TRUST_HOST: true
      GATEWAY_URL: http://gateway:8080
      GEOAPIFY_MAP_KEY: ${NEXT_PUBLIC_GEOAPIFY_MAP_KEY:-}
    ports: [127.0.0.1:3000:3000]
    networks: [backend]
    restart: unless-stopped
    init: true
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
  observability:
    profiles: [observability]
    mem_limit: 2g
    memswap_limit: 2g
    image: grafana/otel-lgtm:0.11.0
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/ready"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/setup.py}
    ports: [127.0.0.1:3001:3000]
    volumes:
      - ./deploy/grafana/datasources.yml:/otel-lgtm/grafana/conf/provisioning/datasources/swiftride.yaml:ro
      - ./deploy/grafana/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/swiftride.yaml:ro
      - ./deploy/grafana/swiftride.json:/otel-lgtm/dashboards/swiftride.json:ro
      - ./deploy/grafana/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    networks: [backend]
    restart: unless-stopped
networks:
  backend:
volumes:
  trip-data:
  match-data:
  pay-data:
  rabbit-data:
  identity-data:
