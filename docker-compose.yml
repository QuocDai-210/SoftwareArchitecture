name: swiftride-pdf
x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  Auth__Authority: http://localhost:8180/realms/swiftride
  Auth__Backchannel: http://keycloak:8180/realms/swiftride
  Rabbit__Host: rabbitmq
  Rabbit__Username: ${RABBIT_USER:-swiftride}
  Rabbit__Password: ${RABBIT_PASSWORD:?Run scripts/setup.py}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  Logging__LogLevel__Microsoft: Warning
  Logging__LogLevel__System.Net.Http.HttpClient: Warning
x-api: &api
  mem_limit: 384m
  memswap_limit: 384m
  restart: unless-stopped
  networks: [backend]
  init: true
  healthcheck:
    interval: 15s
    timeout: 8s
    retries: 10
    start_period: 40s
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: [start-dev, --import-realm, --http-port=8180, --health-enabled=true]
    mem_limit: 1280m
    memswap_limit: 1280m
    environment:
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
      KC_LOG_LEVEL: info,org.keycloak.events:error
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      RIDER_PASSWORD: ${RIDER_PASSWORD:?Run scripts/setup.py}
      DRIVER_PASSWORD: ${DRIVER_PASSWORD:?Run scripts/setup.py}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:?Run scripts/setup.py}
    ports: ["[::1]:8180:8180"]
    networks: [backend]
    volumes:
      - identity-data:/opt/keycloak/data
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/swiftride.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q 200
      interval: 8s
      timeout: 5s
      retries: 30
  mongo:
    mem_limit: 768m
    memswap_limit: 768m
    command: [mongod, --wiredTigerCacheSizeGB, "0.25"]
    image: mongo:8.0.8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run scripts/setup.py}
      MATCH_DB_PASSWORD: ${MATCH_DB_PASSWORD:?Run scripts/setup.py}
    volumes: [match-data:/data/db, ./deploy/mongo/init.js:/docker-entrypoint-initdb.d/10-user.js:ro]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand("ping").ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 20
  postgres:
    mem_limit: 1g
    memswap_limit: 1g
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_DB: PayDB
      POSTGRES_USER: swiftride_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/setup.py}
    volumes: [pay-data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U swiftride_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
  postgres-init:
    mem_limit: 128m
    memswap_limit: 128m
    image: postgres:17.4-alpine3.21
    entrypoint: [/bin/sh, /init.sh]
    environment:
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/setup.py}
      TRIP_DB_PASSWORD: ${TRIP_DB_PASSWORD:?Run scripts/setup.py}
      PAY_DB_PASSWORD: ${PAY_DB_PASSWORD:?Run scripts/setup.py}
    volumes: [./deploy/postgres/init.sh:/init.sh:ro]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
  rabbitmq:
    hostname: rabbitmq
    mem_limit: 384m
    memswap_limit: 384m
    build: ./deploy/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-swiftride}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Run scripts/setup.py}
    ports: ["[::1]:15672:15672"]
    volumes: [rabbit-data:/var/lib/rabbitmq]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 8s
      retries: 20
  trip:
    <<: *api
    build: { context: ./backend, args: { SERVICE: TripService } }
    environment:
      <<: *api-env
      Auth__ServiceSecret: ${SERVICE_CLIENT_SECRET:?Run scripts/setup.py}
      ConnectionStrings__Trip: Host=postgres;Database=TripDB;Username=trip;Password=${TRIP_DB_PASSWORD};GSS Encryption Mode=Disable
    healthcheck:
      test: [CMD, dotnet, TripService.dll, --health]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      keycloak: { condition: service_healthy }
      matching: { condition: service_healthy }
      postgres-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
  matching:
    <<: *api
    build: { context: ./backend, args: { SERVICE: MatchingService } }
    environment:
      <<: *api-env
      ConnectionStrings__Matching: mongodb://matching:${MATCH_DB_PASSWORD}@mongo:27017/MatchDB?authSource=MatchDB
      Fixtures__Enabled: ${FIXTURES_ENABLED:-true}
      Pricing__Surge: ${PRICING_SURGE:-1}
      Pricing__Toll: ${PRICING_TOLL:-0}
      Pricing__Promotion: ${PRICING_PROMOTION:-1}
      Pricing__Tax: ${PRICING_TAX:-0.1}
    healthcheck:
      test: [CMD, dotnet, MatchingService.dll, --health]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      keycloak: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  payment:
    <<: *api
    build: { context: ./backend, args: { SERVICE: PaymentService } }
    environment:
      <<: *api-env
      ConnectionStrings__Payment: Host=postgres;Database=PayDB;Username=payment_app;Password=${PAY_DB_PASSWORD};GSS Encryption Mode=Disable
    healthcheck:
      test: [CMD, dotnet, PaymentService.dll, --health]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      keycloak: { condition: service_healthy }
      postgres-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
  gateway:
    <<: *api
    build: { context: ./backend, args: { SERVICE: ApiGateway } }
    environment:
      <<: *api-env
    ports: ["[::1]:8080:8080"]
    healthcheck:
      test: [CMD, dotnet, ApiGateway.dll, --health]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      trip: { condition: service_healthy }
      matching: { condition: service_healthy }
      payment: { condition: service_healthy }
  web:
    build: ./frontend
    mem_limit: 384m
    memswap_limit: 384m
    ports: ["[::1]:8976:3000"]
    environment:
      AUTH_URL: http://localhost:8976
      AUTH_SECRET: ${WEB_SESSION_SECRET:?Run scripts/setup.py}
      OIDC_ISSUER: http://localhost:8180/realms/swiftride
      OIDC_BACKCHANNEL: http://keycloak:8180/realms/swiftride
      GATEWAY_URL: http://gateway:8080
    networks: [backend]
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
  observability:
    profiles: [observability]
    mem_limit: 2g
    memswap_limit: 2g
    image: grafana/otel-lgtm:0.11.0
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/ready"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/setup.py}
    ports: ["[::1]:3001:3000"]
    volumes:
      - ./deploy/grafana/datasources.yml:/otel-lgtm/grafana/conf/provisioning/datasources/swiftride.yaml:ro
      - ./deploy/grafana/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/swiftride.yaml:ro
      - ./deploy/grafana/swiftride.json:/otel-lgtm/dashboards/swiftride.json:ro
      - ./deploy/grafana/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    networks: [backend]
    restart: unless-stopped
networks:
  backend:
volumes:
  identity-data:
  match-data:
  pay-data:
  rabbit-data:
